[tools]
node = "24.22.1"
actionlint = "1.7.12"
go = "1.27.3"
zizmor = "1.31.1"

[env]
GOWORK = "off"

[tasks.fmt]
description = "Format Go sources"
run = "git ls-files -z '*.go' | xargs -0 gofmt -w"

[tasks."fmt:check"]
description = "Check Go source formatting"
run = "git ls-files -z '*.go' | xargs -0 gofmt -l | (! grep .)"

[tasks."mod:tidy"]
description = "Tidy Go module metadata"
run = 'go mod tidy'

[tasks."mod:check"]
description = "Ensure go.mod and go.sum are tidy without mutating them"
run = 'go mod tidy -diff'

[tasks.test]
description = "Run parser unit tests"
run = 'go test ./...'

[tasks.vet]
description = "Run Go static checks"
run = 'go vet ./...'

[tasks.actions]
description = "Validate and audit GitHub Actions"
run = ["actionlint", "zizmor .github/workflows"]

[tasks."release:smoke"]
description = "Check the shared release rules with a dry semantic-release run"
run = [
  "npm ci --prefix .github/release --ignore-scripts --no-audit --no-fund",
  "node .github/release/smoke.mjs"
]

[tasks."corpus:metrics"]
description = "Fail when parser field presence across committed Jackett fixtures drops below its floors"
run = """
go run ./cmd/corpusmetrics \
  --min release_info=100 \
  --min title=100 \
  --min resolution=90 \
  --min quality=80 \
  --min codec=95 \
  --min audio=65 \
  --min source=20 \
  --min group=50
"""

[tasks.bench]
description = "Run each parser benchmark once"
run = "go test . -run=^$ -bench=BenchmarkParse -benchmem -count=1"

[tasks."bench:record"]
description = "Record parser benchmark output for before/after comparison"
run = """
set -o pipefail
out="${BENCH_OUT:-tmp/bench/current.txt}"
mkdir -p "$(dirname "$out")"
go test . -run=^$ -bench=BenchmarkParse -benchmem -count="${BENCH_COUNT:-5}" | tee "$out"
"""

[tasks."bench:compare"]
description = "Compare two parser benchmark output files"
run = """
baseline="${BENCH_BASELINE:-tmp/bench/baseline.txt}"
current="${BENCH_CURRENT:-tmp/bench/current.txt}"
go tool benchstat "$baseline" "$current"
"""

[tasks."fixtures:jackett"]
description = "Refresh curated Jackett search fixtures from a live local Jackett"
run = """
if [ -z "${JACKETT_API_KEY:-}" ]; then
  printf 'JACKETT_API_KEY is required\n' >&2
  exit 1
fi

JACKETT_BASE_URL="${JACKETT_BASE_URL:-http://localhost:9117}" \
go run ./cmd/jackettfixtures
"""

[tasks."test:fuzz"]
description = "Run the parser fuzz target for a short local pass"
run = 'go test . -run=^$ -fuzz=FuzzParse -fuzztime=5s'

[tasks.verify]
description = "Run formatting, static, and test checks"
depends = ["fmt:check", "mod:check", "vet", "actions", "test", "corpus:metrics"]
